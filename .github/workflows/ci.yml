name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haqdaar
          POSTGRES_PASSWORD: haqdaar
          POSTGRES_DB: haqdaar
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U haqdaar" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      AI_PROFILE: offline
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate secrets for the test run
        run: node scripts/gen-keys.mjs
      - name: Prisma clients
        run: pnpm db:generate
      - name: Build
        run: pnpm build
      - name: AI golden-set safety evaluation (offline)
        run: pnpm eval:ai
      - name: Unit tests
        run: pnpm test
      - name: Golden-set evaluation (decision engine)
        run: pnpm --filter @haqdaar/cases eval:check
      - name: Database schemas
        run: pnpm db:push
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high --prod
        continue-on-error: true
