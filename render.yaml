# Render Blueprint: the whole Haqdaar stack on the FREE plan (see docs/DEPLOY.md).
#
# Everything is wired here: one free Postgres (each service keeps its own schema in it), secrets
# generated by Render, and service URLs. Only two values are entered by hand when the Blueprint
# is created: JWT_PRIVATE_KEY (identity) and GROQ_API_KEY (ai).
#
# Free web services cannot RECEIVE private-network traffic, so services call each other over their
# public https URLs. That is safe: every internal call carries a 60-second internal token with the
# target service as audience, and every service verifies user JWTs itself.
#
# If Render had to add a suffix to a service name (name taken), update the URLs in haqdaar-config.

databases:
  - name: hq26-db
    plan: free
    region: singapore
    databaseName: haqdaar
    user: haqdaar

envVarGroups:
  - name: haqdaar-config
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Judge Mode + demo reset + demo seed on boot. Remove for anything that is not a demo.
      - key: DEMO_MODE
        value: '1'
      - key: DEMO_PASSWORD
        value: demo1234
      - key: CORS_ORIGINS
        value: https://hq26-web.onrender.com
      - key: GATEWAY_URL
        value: https://hq26-gateway.onrender.com
      - key: IDENTITY_URL
        value: https://hq26-identity.onrender.com
      - key: CASES_URL
        value: https://hq26-cases.onrender.com
      - key: AI_URL
        value: https://hq26-ai.onrender.com
      - key: PAYMENTS_URL
        value: https://hq26-payments.onrender.com
      - key: AUDIT_URL
        value: https://hq26-audit.onrender.com
      - key: RAILS_URL
        value: https://hq26-rails.onrender.com
      - key: JUDGE_URL
        value: https://hq26-judge.onrender.com
      - key: KNOWLEDGE_URL
        value: https://hq26-knowledge.onrender.com
      # Public half of the token key pair: not a secret. The private half lives only in identity.
      - key: JWT_PUBLIC_KEY
        value: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyaYJo1NadZ8W9FcVbPTE
          6Bsh1w8BTDfB0gGZnOPcmgHj7OfjOm/9NsBNnLcK7jrzZTu4IfkajnkGYcN5Swlu
          giV/EbYrvv5sO2OC0ErCZ9yh8ZuZ7j97osncKhdJp6Ml/esQASKWcDKbyVG1Ia70
          A1WjA9jv/or/tyjRIrT29NqTAQWWeC9cGBq9I7trFVFfl3cO+wbAwq+jSCF/EVg6
          n6Fu0z1Tl2rqL/bB3TFAh/x5A45Vbgc/bTc0j1MO5LT6rbBAQiKRJLymKNlTS4tD
          VGY0g0JopqxwH6B5sXpCdYjXBoTdPc6yOZxDIbotIRMvFsv4NO8rwoQ/gJdIAQoT
          tQIDAQAB
          -----END PUBLIC KEY-----
      - key: INTERNAL_SECRET
        generateValue: true
      - key: PII_ENC_KEY
        generateValue: true
      - key: PII_HASH_KEY
        generateValue: true
      - key: SEAL_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true

services:
  - type: web
    name: hq26-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: gateway
      - fromGroup: haqdaar-config
      - key: RATE_LIMIT_PER_MINUTE
        value: '1200'
  - type: web
    name: hq26-identity
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: identity
      - fromGroup: haqdaar-config
      - key: DATABASE_URL
        fromDatabase:
          name: hq26-db
          property: connectionString
      - key: JWT_PRIVATE_KEY
        sync: false
  - type: web
    name: hq26-cases
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: cases
      - fromGroup: haqdaar-config
      - key: DATABASE_URL
        fromDatabase:
          name: hq26-db
          property: connectionString
  - type: web
    name: hq26-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: ai
      - fromGroup: haqdaar-config
      - key: DATABASE_URL
        fromDatabase:
          name: hq26-db
          property: connectionString
      - key: AI_PROFILE
        value: dev
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_DEMO_API_KEY
        sync: false
  - type: web
    name: hq26-payments
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: payments
      - fromGroup: haqdaar-config
      - key: DATABASE_URL
        fromDatabase:
          name: hq26-db
          property: connectionString
  - type: web
    name: hq26-audit
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: audit
      - fromGroup: haqdaar-config
      - key: DATABASE_URL
        fromDatabase:
          name: hq26-db
          property: connectionString
  - type: web
    name: hq26-rails
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: rails-mock
      - fromGroup: haqdaar-config

  - type: web
    name: hq26-judge
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: judge
      - fromGroup: haqdaar-config
      - key: DATABASE_URL
        fromDatabase:
          name: hq26-db
          property: connectionString
  - type: web
    name: hq26-knowledge
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: knowledge
      - fromGroup: haqdaar-config
      - key: DATABASE_URL
        fromDatabase:
          name: hq26-db
          property: connectionString
      - key: AI_PROFILE
        value: dev
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: hq26-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@haqdaar/web..." && pnpm --filter @haqdaar/web build
    startCommand: cd apps/web && pnpm exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Read at build time by next.config.ts: /api/* is forwarded to the gateway (same origin, no CORS).
      - key: GATEWAY_URL
        value: https://hq26-gateway.onrender.com
